# yamllint disable rule:line-length
name: codecov
'on':
  workflow_dispatch:
concurrency:
  group: codecov-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codecov:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    timeout-minutes: 15
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: ${{ matrix.distribution || 'temurin' }}
        java-version: ${{ matrix.java || '25.0.4+101.0.LTS' }}
        architecture: ${{ matrix.arch }}
    - uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-
    - run: mvn install -Pjacoco
    - uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    name: codecov [${{ matrix.expander_leg }}]
